<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>White Water Rafting | Contact Us</title>

  <meta name="description"
    content="Contact White Water Rafting Company for reservations, questions, and rafting information.">

  <meta name="author" content="Nullie James">

  <link rel="stylesheet" href="styles/rafting.css" type="text/css">
</head>

<body>

  <!-- ================= HEADER ================= -->

  <header>

    <img src="images/logo.png" alt="White Water Rafting Logo">

    <nav>
      <a href="index.html">Home</a>
      <a href="about.html">About Us</a>
      <a href="trips.html">Trips</a>
      <a href="contact.html">Contact Us</a>
    </nav>

  </header>


  <!-- ================= MAIN ================= -->

  <main>

    <!-- CONTACT INTRO -->

    <section class="contact-intro">

      <h1>White Water Rafting Company</h1>

      <address>
        123 Main Motor Road<br>
        Grafton, Freetown<br>
        +232 74 825 623<br>
        info@whitewater.com
      </address>

    </section>


    <!-- MAP AND FORM -->

    <section class="contact-form-area">

      <h2>Contact Us</h2>

      <!-- MAP -->
      <iframe class="map"
        src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d15788.329833089067!2d-13.165858983993525!3d8.393550746959619!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0xf04e74342888e25%3A0xd74795482648dd4e!2sThe%20Church%20of%20Jesus%20Christ%20of%20Latter-day%20Saints!5e0!3m2!1sen!2ssl!4v1786249331847!5m2!1sen!2ssl"
        title="White Water Rafting Company location map" loading="lazy" allowfullscreen
        referrerpolicy="strict-origin-when-cross-origin"></iframe>


      <!-- FORM -->

      <form class="contact-form">

        <div class="form-row">

          <label for="name">Name</label>

          <input type="text" id="name" name="name" placeholder="Placeholder" required>

        </div>


        <div class="form-row">

          <label for="email">Email</label>

          <input type="email" id="email" name="email" placeholder="Placeholder" required>

        </div>


        <!-- PURPOSE -->

        <fieldset class="radio-group">

          <legend>What is your reason for contacting us?</legend>

          <label for="general">
            <input type="radio" id="general" name="purpose" value="general" required>
            General Inquiry
          </label>

          <label for="reservation">
            <input type="radio" id="reservation" name="purpose" value="reservation">
            Reservation Question
          </label>

          <label for="suggestion">
            <input type="radio" id="suggestion" name="purpose" value="suggestion">
            Website Suggestion
          </label>

        </fieldset>


        <!-- MESSAGE -->

        <label class="message-label" for="message">
          Message
        </label>

        <textarea id="message" name="message" placeholder="Type here" required></textarea>


        <!-- NEWSLETTER -->

        <div class="subscribe">

          <label for="subscribe">

            <input type="checkbox" id="subscribe" name="subscribe">

            Please Subscribe me to the monthly newsletter

          </label>

        </div>


        <!-- BUTTON -->

        <button type="submit">
          Get in Touch!
        </button>

      </form>

    </section>


    <!-- EMPLOYEES -->

    <section class="employees">

      <h2>We Are Here to Serve You</h2>


      <figure class="employee">

        <img src="images/avero.jpg" alt="Employee profile">

        <figcaption>Michael Brown — Adventure Manager</figcaption>

      </figure>


      <figure class="employee">

        <img src="images/big-mallard.jpg" alt="Employee profile">

        <figcaption>Sarah Williams — Safety Coordinator</figcaption>
      </figure>


      <figure class="employee">

        <img src="images/half-day.jpg" alt="Employee profile">

        <figcaption>Alex Johnson — River Guide</figcaption>
      </figure>

      <figure class="employee">

        <img src="images/wera.jpg" alt="River guide">
        <figcaption>David Kamara — Senior Drive Guide </figcaption>
      </figure>

    </section>

  </main>


  <!-- ================= FOOTER ================= -->

  <footer>

    <p>
      &copy; 2026🌳 White Water Rafting Adventure Company 🌳 Nullie James, Freetown, Sierra Leone
    </p>

    <nav class="socialmedia">

      <a href="https://www.facebook.com">
        <img src="images/facebook-bw.svg" alt="Facebook">
      </a>

      <a href="https://www.instagram.com">
        <img src="images/instagram-bw.svg" alt="Instagram">
      </a>

      <a href="https://www.linkedin.com">
        <img src="images/linkedin-bw.svg" alt="LinkedIn">
      </a>

    </nav>

  </footer>
</body>

</html>
